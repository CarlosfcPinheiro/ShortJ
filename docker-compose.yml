services:
  postgres:
    image: postgres:17
    container_name: shortj-postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: shortJ123
      POSTGRES_DB: shortJ_db
      POSTGRES_USER: shortj_user
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shortj-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:latest
    container_name: shortj-redis
    ports:
      - "6379:6379"
    networks:
      - shortj-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

networks:
  shortj-network:
    driver: bridge
